  <rect x='120' y='100' width='220' height='290' rx='16' fill='#FFFFFF' opacity='0.95'/>
  <line x1='160' y1='160' x2='260' y2='160' stroke='#94A3B8' stroke-width='14' stroke-linecap='round' />
  <line x1='160' y1='200' x2='300' y2='200' stroke='#CBD5E1' stroke-width='12' stroke-linecap='round' />
  <line x1='160' y1='240' x2='280' y2='240' stroke='#CBD5E1' stroke-width='12' stroke-linecap='round' />
  <line x1='160' y1='280' x2='240' y2='280' stroke='#CBD5E1' stroke-width='12' stroke-linecap='round' />
  <!-- Lens/Circle highlight -->
  <circle cx='310' cy='310' r='90' fill='none' stroke='url(#accent)' stroke-width='22' filter='url(#glow)' stroke-dasharray='12 8'/>
  <circle cx='310' cy='310' r='80' fill='#10A37F' fill-opacity='0.15' />
  <!-- Sparkle/AI star -->
  <path d='M310 270 L318 298 L346 306 L318 314 L310 342 L302 314 L274 306 L302 298 Z' fill='#10A37F' />
